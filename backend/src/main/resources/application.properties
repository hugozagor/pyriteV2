spring.application.name=pyrite

# --- Database (MariaDB 10.11) ---
spring.datasource.url=jdbc:mariadb://localhost:3306/pyrite?useUnicode=true&characterEncoding=UTF-8
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=pyrite
spring.datasource.password=pyrite
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- File uploads ---
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# --- Pyrite app settings ---
pyrite.storage.location=./media
pyrite.admin.email=admin@pyrite.tv
pyrite.admin.username=dioptase
pyrite.admin.password=pyrite-admin
pyrite.admin.display-name=Dioptase

# JWT secret (override in production). Must be >= 32 bytes for HS256.
pyrite.jwt.secret=change-me-please-pyrite-super-secret-key-0123456789
pyrite.jwt.expiration-ms=604800000

server.port=8090

# Surface ResponseStatusException reasons (e.g. "Identifiants invalides") to the client.
server.error.include-message=always
